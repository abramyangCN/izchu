[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "izchu"
version = "0.1.0"
description = "Private Strava and Garmin activity reader"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "garmin-fit-sdk>=21,<22",
  "garminconnect>=0.3.19,<0.4",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
izchu = "izchu.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/izchu"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

